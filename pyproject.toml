[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-browser-agent"
version = "0.1.0"
description = "Generic autonomous AI agent for multi-step browser tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.scripts]
browser-agent = "browser_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
